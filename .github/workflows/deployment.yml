name: Deployment

on:
  release:
    types: [published]
  pull_request:

env:
  DOCKER_IMAGE: ${{ format('{0}:{1}', 'ngfk-directus/directus', github.event_name == 'release' && github.ref_name || github.sha) }}
  GCP_PROJECT: ngfk-directus-458008
  GCP_REGION: europe-west4
  GCP_WIP_SA: github-actions@ngfk-directus-458008.iam.gserviceaccount.com
  GCP_WIP: projects/941738439482/locations/global/workloadIdentityPools/github/providers/github-actions

jobs:
  docker_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@main
      - name: Log in to GitHub registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin
      - name: Build docker image
        run: docker build . -t $DOCKER_IMAGE
      - name: Tag docker image
        if: github.event_name == 'release'
        run: docker tag $DOCKER_IMAGE ghcr.io/${{ github.repository_owner }}/$DOCKER_IMAGE
      - name: Push docker image
        if: github.event_name == 'release'
        run: docker push ghcr.io/${{ github.repository_owner }}/$DOCKER_IMAGE

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    needs:
      - docker_image
    steps:
      - uses: actions/checkout@main
      - name: 1Password
        uses: 1password/load-secrets-action@v1
        id: env
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DOTENV: op://NGFK Environment/NGFK Directus/notesPlain
      - name: Create .env file
        run: echo "${{ steps.env.outputs.DOTENV }}" > .env

      - name: Authenticate GCP
        uses: 'google-github-actions/auth@v2'
        id: 'auth'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ env.GCP_WIP }}'
          service_account: '${{ env.GCP_WIP_SA }}'
      - name: Log in to GitHub registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin
      - name: Log in to GCP registry
        run: echo "${{ steps.auth.outputs.access_token }}" | docker login ${{ env.GCP_REGION }}-docker.pkg.dev -u oauth2accesstoken --password-stdin

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
      - name: Terraform Init
        working-directory: terraform
        run: >-
          terraform init
          -backend-config="bucket=$GCP_PROJECT-tf-state"
      - name: Terraform Format
        working-directory: terraform
        run: terraform fmt -check
      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate -no-color
      - name: Terraform Plan
        if: github.event_name != 'release'
        working-directory: terraform
        run: >-
          terraform plan
          -no-color
          -input=false
          -var="project_id=$GCP_PROJECT"
          -var="region=$GCP_REGION"
          -var="image=$DOCKER_IMAGE"
      - name: Terraform Apply
        if: github.event_name == 'release'
        working-directory: terraform
        run: >-
          terraform apply
          -auto-approve
          -input=false
          -var="project_id=$GCP_PROJECT"
          -var="region=$GCP_REGION"
          -var="image=$DOCKER_IMAGE"
